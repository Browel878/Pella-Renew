name: 🎮 Pella 自动续期
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  renew:
    name: 🔄 执行续期
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        run: npm install

      - name: 🌐 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb x11-utils

      - name: ⚙ 设置代理 (sing-box，读取 NODE_LINK)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          PELLA_ACCOUNT: ${{ secrets.PELLA_ACCOUNT }}
          TG_BOT:        ${{ secrets.TG_BOT }}
          IS_PROXY:      ${{ env.IS_PROXY }}
          PROXY_SERVER:  ${{ env.PROXY_SERVER }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npx playwright test tests/pella_renew.spec.js

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 7
